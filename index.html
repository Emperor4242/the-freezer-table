  if(id==='chicken-parmesan')food=`<ellipse cx="164" cy="116" rx="84" ry="51" fill="#bd934b" transform="rotate(-9 164 116)"/><ellipse cx="164" cy="116" rx="73" ry="43" fill="#e8b65c" transform="rotate(-9 164 116)"/><path d="M107 105 Q130 67 177 97 T224 118 Q198 154 153 137 T107 105" fill="#c75c46"/><path d="M129 95 Q162 85 184 107 T204 121 M122 119 Q151 107 168 130" fill="none" stroke="#f7efd5" stroke-width="13" stroke-linecap="round"/><path d="M107 141 q12 13 20 2 m71 -46 q10 4 13 -4" fill="none" stroke="#5e865c" stroke-width="6" stroke-linecap="round"/>`;
  if(id==='burritos')food=`<g transform="rotate(-22 166 114)"><rect x="91" y="70" width="82" height="98" rx="36" fill="#d9ae71"/><rect x="101" y="76" width="66" height="85" rx="31" fill="#efc990"/><path d="M103 91 Q134 77 165 93" stroke="#b8834c" stroke-width="4" fill="none"/></g><g transform="rotate(18 189 117)"><rect x="161" y="70" width="79" height="102" rx="36" fill="#d4a56e"/><rect x="167" y="76" width="67" height="87" rx="30" fill="#f3d6a7"/><path d="M176 84 l11 7 9 -8 10 9 12 -8" stroke="#758451" stroke-width="10" fill="none"/><path d="M179 101 q19 -8 36 3 m-31 14 q19 4 36 0" stroke="#8b563c" stroke-width="8" fill="none"/></g>`;
  if(id==='chicken-casserole')food=`<ellipse cx="160" cy="118" rx="92" ry="61" fill="#b58a50"/><ellipse cx="160" cy="115" rx="86" ry="55" fill="#ead08a"/><path d="M92 106 Q129 64 167 105 T232 107 M97 138 Q136 104 181 139 T227 139" stroke="#f4df9e" stroke-width="13" fill="none"/><g fill="#5d855a"><circle cx="115" cy="97" r="14"/><circle cx="141" cy="124" r="14"/><circle cx="202" cy="109" r="16"/><circle cx="185" cy="144" r="11"/></g><g fill="#f3edcf"><circle cx="154" cy="86" r="11"/><circle cx="109" cy="132" r="10"/><circle cx="220" cy="135" r="9"/></g>`;
  if(id==='chicken-pot-pie')food=`<ellipse cx="160" cy="118" rx="91" ry="65" fill="#875a3e"/><ellipse cx="160" cy="112" rx="89" ry="64" fill="#cc9951"/><ellipse cx="160" cy="110" rx="82" ry="59" fill="#e6bd75"/><path d="M103 108 Q130 91 158 110 T219 110 M130 74 Q145 107 128 143 M196 85 Q180 110 200 140" stroke="#f4d89a" stroke-width="7" stroke-linecap="round" fill="none"/><path d="M145 90 l30 25 m-30 0 l30 -25" stroke="#a66e3b" stroke-width="5" stroke-linecap="round"/><g fill="#b87b41"><circle cx="111" cy="84" r="3"/><circle cx="202" cy="117" r="4"/><circle cx="152" cy="151" r="3"/></g>`;
  return `<svg viewBox="0 0 320 220" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Illustration of ${htmlSafe(r.title)}"><rect width="320" height="220" fill="${r.theme}"/><circle cx="272" cy="20" r="93" fill="#fff" opacity=".13"/><circle cx="20" cy="206" r="100" fill="#fff" opacity=".13"/><g transform="translate(0 8)">${base}${food}</g><path d="M37 42 q16 -25 32 0 m-21 -10 q15 -8 26 13" fill="none" stroke="${r.accent}" stroke-width="2" opacity=".65"/><path d="M248 185 q16 -25 32 0 m-21 -10 q15 -8 26 13" fill="none" stroke="${r.accent}" stroke-width="2" opacity=".65"/></svg>`;
}
function renderIdeas(){
  app.innerHTML=`<div class="page-intro"><div class="idea-intro"><span class="eyebrow">The next batch</span><h1>Ideas for a fuller freezer.</h1><p>${recipeIdeas.length} possible new dishes, chosen with fibre in mind. Beans, lentils, vegetables and wholegrains take centre stage. No beef, pork or Indian dishes.</p><div class="note"><strong>Speculative ideas · not yet developed</strong><p>These are starting points for future recipes. Quantities, cooking times and freezer methods still need developing and testing. Fibre per portion has not been calculated, and these ideas are not included in the shopping list.</p></div></div><a href="#home" class="btn">Browse complete recipes ↗</a></div>
  <ol class="idea-grid" aria-label="Ten speculative recipe ideas">${recipeIdeas.map((idea,index)=>`<li class="panel idea-card" id="idea-${idea.id}"><div class="idea-art"><img src="images/ideas/${idea.id}.svg" alt="Illustration of ${htmlSafe(idea.title)}" width="640" height="440" loading="lazy" decoding="async"></div><div class="idea-content"><div class="idea-topline"><span class="idea-number" aria-hidden="true">${String(index+1).padStart(2,'0')}</span><span class="pill idea-status">Speculative idea</span></div><span class="idea-kind">${htmlSafe(idea.kind)}</span><h2>${htmlSafe(idea.title)}</h2><p>${htmlSafe(idea.concept)}</p><dl class="idea-details"><dt>Fibre sources</dt><dd>${htmlSafe(idea.fibre)}</dd><dt>Freezer approach to test</dt><dd>${htmlSafe(idea.freezerPlan)}</dd></dl></div></li>`).join('')}</ol>
  <p class="idea-source">The ingredient choices follow <a href="https://www.nhs.uk/live-well/eat-well/digestive-health/how-to-get-more-fibre-into-your-diet/" target="_blank" rel="noopener noreferrer">NHS guidance on adding fibre</a>: include pulses, vegetables and wholegrain foods. The ideas are not ranked by measured fibre content.</p>`;
}
function linkItems(){const h=location.hash||'#home';document.getElementById('main-nav').innerHTML=[['#home','⌂','All recipes'],['#ideas','✧','Recipe ideas'],['#shopping','▤','Shopping list'],['#guide','✳','Freezer guide']].map(([url,icon,label])=>`<a class="nav-link ${h===url?'is-active':''}" href="${url}"><span class="nav-icon">${icon}</span>${label}</a>`).join('');document.getElementById('recipe-nav').innerHTML=recipes.map(r=>`<a class="nav-link ${h==='#recipe/'+r.id?'is-active':''}" href="#recipe/${r.id}"><span class="nav-icon">${r.icon}</span>${htmlSafe(r.title)}</a>`).join('');}
function renderHome(){const terms=state.search.toLowerCase().trim();const shown=recipes.filter(r=>(state.filter==='All'||r.category===state.filter)&&(`${r.title} ${r.short} ${r.tag} ${r.category}`.toLowerCase().includes(terms)));app.innerHTML=`<section class="hero"><div class="hero-copy"><span class="eyebrow" style="color:#e8cba4">The home cookbook</span><h1>Good food.<br><em>Ready when you are.</em></h1><p>A small, thoughtful collection of freezer-friendly favourites. Cook generously today and make tomorrow easier.</p><a class="btn btn-outline-dark" href="#shopping">Plan the next batch &nbsp;↗</a><div class="hero-stats"><div class="hero-stat"><strong>06</strong><span>Curated recipes</span></div><div class="hero-stat"><strong>52</strong><span>Individual portions*</span></div><div class="hero-stat"><strong>01</strong><span>Organised kitchen</span></div></div></div><div class="hero-art">${art('chicken-pot-pie')}<div class="hero-caption">Made with care.</div></div></section><div class="section-heading"><div><span class="eyebrow">Explore the collection</span><h2>Recipes worth making twice.</h2><p>Choose a dish, adjust the quantities, then follow the fresh or freezer method.</p></div></div><div class="tool-row"><div class="filters">${['All','Oven-ready','Vegetarian','Freezer components'].map(f=>`<button type="button" class="filter ${state.filter===f?'active':''}" data-filter="${f}">${f}</button>`).join('')}</div><input class="search" id="recipe-search" type="search" placeholder="Search the recipes…" aria-label="Search recipes" value="${htmlSafe(state.search)}"></div><div class="recipe-grid" id="cards">${shown.map(card).join('')||'<div class="empty">No recipes match. Try another search or filter.</div>'}</div><section class="banner"><div><span class="eyebrow">Plan ahead</span><h3>One list. Fewer supermarket trips.</h3><p>Your shopping list starts with the burritos, casserole and chicken pot pies.</p></div><a href="#shopping" class="btn btn-dark">Open shopping list &nbsp;↗</a></section><section class="banner ideas-banner" aria-labelledby="ideas-teaser-title"><div><span class="eyebrow">Ideas for the next batch</span><h3 id="ideas-teaser-title">More beans. More possibilities.</h3><p>Explore ${recipeIdeas.length} fibre-focused ideas, clearly marked as speculative and ready to develop.</p></div><a href="#ideas" class="btn">Explore recipe ideas &nbsp;↗</a></section><div class="footnote">*The collection totals 52 listed portions, counting each burrito as one portion. Serving sizes vary.</div>`;}
function card(r){return `<a class="recipe-card" href="#recipe/${r.id}"><div class="card-illustration">${art(r.id)}</div><div class="card-body"><div class="card-topline"><span>${htmlSafe(r.tag)}</span><span class="pill">${r.portions} ${r.portionUnit}</span></div><h3>${htmlSafe(r.title)}</h3><p>${htmlSafe(r.short)}</p><div class="card-foot"><span>◷ &nbsp;${r.prep} prep</span><span>View recipe <i>↗</i></span></div></div></a>`;}
function renderRecipe(r){let m=state.mode[r.id]||r.modes[0].id;if(!r.modes.some(x=>x.id===m))m=r.modes[0].id;const mode=r.modes.find(x=>x.id===m);app.innerHTML=`<a class="backlink" href="#home">← &nbsp; Back to all recipes</a><div class="recipe-hero"><div class="recipe-title"><span class="eyebrow">${htmlSafe(r.tag)} · ${htmlSafe(r.category)}</span><h1>${htmlSafe(r.title)}</h1><p>${htmlSafe(r.short)}</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:26px"><button class="btn btn-dark" data-add-shop="${r.id}">${state.selected.has(r.id)?'✓ Included in shopping list':'+ Add to shopping list'}</button><button class="btn" onclick="window.print()">⎙ Print recipe</button></div></div><div class="detail-art">${art(r.id)}</div></div><div class="meta-strip"><div class="meta-item">◷ <strong>${r.prep}</strong> preparation</div><div class="meta-item">♨ <strong>${r.cook}</strong> typical cooking</div><div class="meta-item">♧ <strong>${r.portions}</strong> ${r.portionUnit}</div><div class="meta-item">❄ <strong>Freezer-friendly</strong></div></div><div class="detail-layout"><section class="panel"><span class="eyebrow">Everything you need</span><h2>Ingredients</h2><p class="panel-sub">Tick things off as you prepare them. Quantities scale automatically.</p><div class="scale-row" aria-label="Scale ingredient quantities">${[.5,1,2].map(x=>`<button class="scale-btn ${state.scale===x?'active':''}" data-scale="${x}">${x===.5?'½':x===1?'1':'2'}× <span style="font-weight:400">(${r.portions*x})</span></button>`).join('')}</div>${r.ingredients.map((group,gi)=>`<div class="ingredient-heading">${htmlSafe(group.heading)}</div><div class="ingredient-list">${group.items.map((i,ii)=>{const key=r.id+'|'+gi+'|'+ii;return `<label class="ingredient"><input type="checkbox" data-ingredient="${key}" ${state.ingredientDone.has(key)?'checked':''}><span>${htmlSafe(amount(i,state.scale))}${i.optional?' <small>· optional</small>':''}</span></label>`}).join('')}</div>`).join('')}</section><section class="panel"><span class="eyebrow">From prep to plate</span><h2>How to make it</h2><p class="panel-sub">Follow these steps to prepare and assemble the dish.</p>${state.scale!==1?`<div class="method-info">Ingredients are scaled to ${r.portions*state.scale} ${r.portionUnit}. The instructions below describe the original ${r.portions}-${r.portionUnit==='burritos'?'burrito':r.portionUnit==='cutlets'?'cutlet':'portion'} batch; adjust quantities, tray numbers and cooking batches accordingly.</div>`:''}<div>${r.steps.map((s,i)=>stepHTML(s,i+1)).join('')}</div><div style="height:1px;background:var(--line);margin:22px 0 25px"></div><span class="eyebrow">Bake & serve</span><h2>Cooking instructions</h2><div class="tab-row" role="tablist" aria-label="Cooking state">${r.modes.map(x=>`<button class="tab ${x.id===m?'active':''}" role="tab" aria-selected="${x.id===m}" data-mode="${x.id}" data-recipe="${r.id}">${x.label}</button>`).join('')}</div><div class="method-info"><strong>${htmlSafe(mode.temperature)}</strong> &nbsp;·&nbsp; ${htmlSafe(mode.time)} <br><span style="font-size:11px">These are estimates: judge by internal temperature and doneness, not the clock alone.</span></div>${mode.steps.map((s,i)=>stepHTML(s,i+1)).join('')}</section></div><div class="detail-footer"><div class="panel"><span class="eyebrow">Put some away</span><h3>Freezer instructions</h3><p>${htmlSafe(r.freezer)}</p></div><div class="panel"><span class="eyebrow">Cook's note</span><h3>Little things that help</h3><p>${htmlSafe(r.tips)}</p></div></div><div class="note"><strong>Food safety</strong><p>Cool cooked ingredients promptly, keep raw chicken refrigerated during preparation, and reheat cooked dishes until steaming hot throughout. A probe thermometer is the most reliable way to check the centre reaches 75°C.</p></div>`;}
function stepHTML(s,n){return `<div class="method-step"><span class="step-number">${n}</span><div><h4>${htmlSafe(s.title)}</h4><p>${htmlSafe(s.text)}</p></div></div>`;}
function listData(){const map=new Map();for(const r of recipes){if(!state.selected.has(r.id))continue;for(const group of r.ingredients){for(const i of group.items){const factor=state.scales[r.id]||1;const key=i.category+'|'+i.name+'|'+(i.unit==='tbsp'||i.unit==='tsp'?'spoons':i.unit)+'|'+i.optional;const qty=i.qty==null?null:(i.unit==='tbsp'?i.qty*3:i.qty)*factor;const unit=i.unit==='tbsp'||i.unit==='tsp'?'tsp':i.unit;if(map.has(key)){const a=map.get(key);if(a.qty!==null&&qty!==null)a.qty+=qty}else map.set(key,{...i,qty,unit,key});}}}return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name));}
function shoppingAmount(i){if(i.qty===null)return i.name;let q=i.qty,u=i.unit;if(u==='tsp'&&q>=6&&q%3===0){q=q/3;u='tbsp'}return amount({...i,qty:q,unit:u});}
const catOrder=['Meat','Vegetables & fruit','Dairy & eggs','Tins & pantry','Herbs & seasoning'];
function renderShopping(){const items=listData();const marked=items.filter(i=>state.done.has(i.key)).length;const bycat=catOrder.map(name=>({name,items:items.filter(i=>i.category===name&&!i.optional)})).filter(g=>g.items.length);const optional=items.filter(i=>i.optional);if(optional.length)bycat.push({name:'Optional extras',items:optional});app.innerHTML=`<div class="page-intro"><div><span class="eyebrow">Make the next batch</span><h1>One thoughtful shopping list.</h1><p>Choose the recipes you're cooking. Ingredients are combined automatically, so you won't accidentally order the same butter, rice or chicken twice.</p></div><button class="btn" id="shopping-reset">Reset to the 3-meal plan</button></div><h3>Choose your meals</h3><div class="select-grid">${recipes.map(r=>`<label class="select-card"><input type="checkbox" data-select="${r.id}" ${state.selected.has(r.id)?'checked':''}><span class="mini-emoji">${r.icon}</span><span>${htmlSafe(r.title)}<br><small style="color:var(--muted);font-weight:400">${r.portions*(state.scales[r.id]||1)} ${r.portionUnit}${(state.scales[r.id]||1)!==1?' · scaled':''}</small></span></label>`).join('')}</div><div class="shopping-layout"><section>${bycat.map(g=>`<div class="shopping-group"><h3>${g.name}</h3><div class="shop-list">${g.items.map(i=>`<label class="shop-line"><input type="checkbox" data-shop-item="${htmlSafe(i.key)}" ${state.done.has(i.key)?'checked':''}><span>${htmlSafe(shoppingAmount(i))}${i.optional?' <small style="color:#a37c5d">(optional)</small>':''}</span></label>`).join('')}</div></div>`).join('')||'<div class="empty">Choose at least one recipe above to generate a shopping list.</div>'}</section><aside class="shopping-aside"><div class="panel"><span class="small-label">Your next cook</span><h3 style="font-size:2.2rem;margin:12px 0">${state.selected.size} ${state.selected.size===1?'recipe':'recipes'}</h3><p>${items.length} distinct shopping items. ${marked} ticked off.</p><div class="progress"><div style="width:${items.length?Math.round(marked/items.length*100):0}%"></div></div><button id="copy-shopping" class="btn btn-light">⧉ &nbsp;Copy shopping list</button><button class="btn btn-outline-dark" onclick="window.print()">⎙ &nbsp;Print checklist</button><p style="font-size:11px;margin:18px 0 0">Amounts reflect the recipe quantities you selected, including any ingredient scaling. These are not necessarily supermarket pack sizes.</p></div></aside></div><div class="footnote">For the original three-meal plan at 1× this totals 2.2 kg chicken thighs, 500 g dry rice, 450 g Cheddar and 950 ml vegetable stock. Optional additions are shown separately.</div>`;}
function renderGuide(){app.innerHTML=`<div class="page-intro"><div><span class="eyebrow">Kitchen reference</span><h1>Make the freezer work for you.</h1><p>Practical notes for safely storing and reheating the dishes in this collection.</p></div><a href="#home" class="btn">Browse the recipes ↗</a></div><div class="tip-grid">${[
['01','Cool promptly','Divide large batches into shallow portions and refrigerate or freeze without delay. Avoid leaving a large hot pot on the worktop for hours.'],['02','Take extra care with rice','Cool cooked rice particularly quickly (ideally within an hour), freeze promptly and reheat only once until steaming hot.'],['03','Label everything','Write the dish, date, whether it is cooked or raw, and the number of portions. Most of these dishes are best eaten within around 2–3 months for quality.'],['04','Use the right dishes','Remove plastic lids and cling film before baking. Only move a dish straight from freezer to hot oven when the manufacturer specifically allows it.'],['05','Check the middle','Deep shepherd’s pies, lasagnes and pot pies may look golden before the centre is hot. Aim for 75°C at the centre; a thermometer is much more reliable than colour.'],['06','Keep crispy food separate','Freeze raw breaded chicken cutlets separately from tomato sauce; finish chicken Parmesan with the sauce and mozzarella just before serving.']].map(([n,t,d])=>`<div class="panel"><span class="eyebrow">${n}</span><h3 style="margin-top:13px">${t}</h3><p>${d}</p></div>`).join('')}</div>`;}
function route(){linkItems();const hash=decodeURI(location.hash||'#home');if(hash.startsWith('#recipe/')){const r=rById(hash.slice(8));if(r)renderRecipe(r);else renderHome()}else if(hash==='#ideas')renderIdeas();else if(hash==='#shopping')renderShopping();else if(hash==='#guide')renderGuide();else renderHome();}
function copyShopping(){const items=listData();const str=`THE FREEZER TABLE — SHOPPING LIST\n${[...state.selected].map(id=>rById(id)?.title).filter(Boolean).join(', ')}\n\n`+catOrder.concat('Optional extras').map(g=>{const arr=items.filter(i=>g==='Optional extras'?i.optional:i.category===g&&!i.optional);return arr.length?g.toUpperCase()+'\n'+arr.map(i=>`${state.done.has(i.key)?'☑':'☐'} ${shoppingAmount(i)}`).join('\n'):''}).filter(Boolean).join('\n\n');const btn=document.getElementById('copy-shopping');const original=btn?.innerHTML;const done=()=>{if(btn){btn.textContent='✓ Copied!';setTimeout(()=>btn.innerHTML=original,1600)}};if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(str).then(done).catch(()=>legacyCopy(str,done))}else legacyCopy(str,done)}
function legacyCopy(str,done){const ta=document.createElement('textarea');ta.value=str;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');done()}catch(e){window.prompt('Copy the shopping list:',str)}ta.remove()}
window.addEventListener('hashchange',()=>{const id=(location.hash||'').startsWith('#recipe/')?location.hash.slice(8):'';state.scale=state.scales[id]||1;route();window.scrollTo({top:0,behavior:'instant'})});
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){state.filter=f.dataset.filter;renderHome();return}const s=e.target.closest('[data-scale]');if(s){state.scale=Number(s.dataset.scale);const r=rById((location.hash||'').slice(8));if(r){state.scales[r.id]=state.scale;save();renderRecipe(r)};return}const m=e.target.closest('[data-mode]');if(m){state.mode[m.dataset.recipe]=m.dataset.mode;const r=rById(m.dataset.recipe);if(r)renderRecipe(r);return}const add=e.target.closest('[data-add-shop]');if(add){if(state.selected.has(add.dataset.addShop))state.selected.delete(add.dataset.addShop);else state.selected.add(add.dataset.addShop);save();const r=rById(add.dataset.addShop);if(r)renderRecipe(r);return}if(e.target.closest('#shopping-reset')){state.selected=new Set(['burritos','chicken-casserole','chicken-pot-pie']);state.done.clear();save();renderShopping();return}if(e.target.closest('#copy-shopping')){copyShopping();return}});
document.addEventListener('input',e=>{if(e.target.id==='recipe-search'){const pos=e.target.selectionStart;state.search=e.target.value;const cards=document.getElementById('cards');if(cards){const terms=state.search.toLowerCase().trim();const shown=recipes.filter(r=>(state.filter==='All'||r.category===state.filter)&&(`${r.title} ${r.short} ${r.tag} ${r.category}`.toLowerCase().includes(terms)));cards.innerHTML=shown.map(card).join('')||'<div class="empty">No recipes match. Try another search or filter.</div>'}e.target.setSelectionRange(pos,pos)}});
document.addEventListener('change',e=>{const el=e.target;if(el.matches('[data-select]')){el.checked?state.selected.add(el.dataset.select):state.selected.delete(el.dataset.select);state.done.clear();save();renderShopping()}else if(el.matches('[data-shop-item]')){el.checked?state.done.add(el.dataset.shopItem):state.done.delete(el.dataset.shopItem);save();const scrollY=window.scrollY;renderShopping();window.scrollTo(0,scrollY)}else if(el.matches('[data-ingredient]')){el.checked?state.ingredientDone.add(el.dataset.ingredient):state.ingredientDone.delete(el.dataset.ingredient);save()}});
route();
</script>
